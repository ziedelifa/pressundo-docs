name: Fix documentation routes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-doc-routes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix English documentation routes
        shell: bash
        run: |
          set -euo pipefail
          find docs -type f -name '*.md' -print0 | xargs -0 sed -i \
            -e 's#](/reference/api-freeze)#](/docs/reference/api-freeze)#g' \
            -e 's#](/reference/helper-index)#](/docs/reference/helper-index)#g' \
            -e 's#](/advanced/conditional-logic-patterns)#](/docs/advanced/conditional-logic-patterns)#g' \
            -e 's#](/vafpress-migration/remove-vafpress)#](/docs/vafpress-migration/remove-vafpress)#g' \
            -e 's#](/vafpress-migration)#](/docs/vafpress-migration)#g' \
            -e 's#](/metaboxes)#](/docs/metaboxes)#g' \
            -e 's#](/fields)#](/docs/fields)#g'

      - name: Fix French documentation routes
        shell: bash
        run: |
          set -euo pipefail
          FR='i18n/fr/docusaurus-plugin-content-docs/current'
          find "$FR" -type f -name '*.md' -print0 | xargs -0 sed -i \
            -e 's#](/fr/reference/api-freeze)#](/fr/docs/reference/api-freeze)#g' \
            -e 's#](/fr/reference/helper-index)#](/fr/docs/reference/helper-index)#g' \
            -e 's#](/fr/vafpress-migration/remove-vafpress)#](/fr/docs/vafpress-migration/remove-vafpress)#g' \
            -e 's#](/fr/metaboxes)#](/fr/docs/metaboxes)#g' \
            -e 's#](/reference/api-freeze)#](/fr/docs/reference/api-freeze)#g' \
            -e 's#](/reference/helper-index)#](/fr/docs/reference/helper-index)#g' \
            -e 's#](/advanced/conditional-logic-patterns)#](/fr/docs/advanced/conditional-logic-patterns)#g' \
            -e 's#](/vafpress-migration/remove-vafpress)#](/fr/docs/vafpress-migration/remove-vafpress)#g' \
            -e 's#](/vafpress-migration)#](/fr/docs/vafpress-migration)#g' \
            -e 's#](/metaboxes)#](/fr/docs/metaboxes)#g' \
            -e 's#](/fields)#](/fr/docs/fields)#g'

      - name: Validate documentation
        run: npm run docs:check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs i18n
          if git diff --cached --quiet; then
            echo 'No route changes needed.'
            exit 0
          fi
          git commit -m 'fix: correct Docusaurus documentation routes'
          git push
